[package]
name = "minieverything"
version = "0.1.0"
edition = "2021"
description = "Everything 的简单 CLI 版：NTFS 全盘文件名索引与秒级搜索"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
regex = "1"
glob = "0.3"
jwalk = "0.8"
chrono = "0.4"
anyhow = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
] }

[profile.release]
lto = true
